site_name: Conrad Challenge 团队参赛与创新实践指南
site_description: 非官方独立学习资料：赛事、工程验证、商业分析与团队实践。
site_url: http://127.0.0.1:8000/
docs_dir: docs
site_dir: site
use_directory_urls: false
copyright: 非官方独立学习资料 · 核查日期 2026-10-12 · 参赛前复核当届规则
theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search:
    lang:
    - zh
    - en
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.arithmatex:
    generic: true
- pymdownx.magiclink
extra_css:
- assets/vendor/katex/katex.min.css
- assets/stylesheets/reading.css
extra_javascript:
- assets/vendor/katex/katex.min.js
- assets/javascripts/math.js
- assets/javascripts/calculators.js
- assets/javascripts/visuals.js
validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
