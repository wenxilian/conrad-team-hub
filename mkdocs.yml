site_name: Conrad Challenge 团队参赛与创新实践指南
site_description: 非官方独立学习资料：赛事、工程验证、商业分析与团队实践。
site_url: http://127.0.0.1:8000/
docs_dir: docs
site_dir: site
use_directory_urls: false
copyright: 非官方独立学习资料 · 核查日期 2026-10-12 · 参赛前复核当届规则
theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
  - navigation.tabs
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search:
    lang:
    - zh
    - en
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
    toc_depth: 2
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.arithmatex:
    generic: true
- pymdownx.magiclink
extra_css:
- assets/vendor/katex/katex.min.css
- assets/stylesheets/reading.css
extra_javascript:
- assets/vendor/katex/katex.min.js
- assets/javascripts/math.js
- assets/javascripts/calculators.js
- assets/javascripts/visuals.js
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
nav:
- 开始阅读:
  - 使用本站: index.md
  - 阅读路线与报名决策:
    - 家长与学生阅读路线: 00-start/reading-paths.md
    - 投入与报名决策: 00-start/decision.md
- 认识赛事:
  - 完整赛事指南: 01-overview/introduction.md
- 历届获奖项目:
  - 案例阅读地图: 02-projects/index.md
  - 独立案例:
    - Soaring Seeds: 02-projects/soaring-seeds.md
    - DiveGuard: 02-projects/diveguard.md
    - VisionBridge: 02-projects/visionbridge.md
    - OctoScope: 02-projects/octoscope.md
    - FireAIDSS: 02-projects/fireaidss.md
    - Aphelion: 02-projects/aphelion.md
    - BeeGuard: 02-projects/beeguard.md
    - OncoMap: 02-projects/oncomap.md
    - RescueBot: 02-projects/rescuebot.md
    - Aquabel: 02-projects/aquabel.md
    - SensAir: 02-projects/sensair.md
    - ChitoClear: 02-projects/chitoclear.md
    - AeroLattice: 02-projects/aerolattice.md
- 工程与技术能力:
  - 编程、三个案例与完整验证: 03-engineering/programming.md
- 商业计划与市场验证:
  - 五种模式、计算与英文表达: 04-business/five-models.md
  - 完整商业案例:
    - BeeGuard：订阅与验证: 04-business/beeguard-case.md
    - DiveGuard：市场与盈亏平衡: 04-business/diveguard-case.md
    - 家庭硬件：六周完整实践: 04-business/household-hardware.md
- 团队与导师:
  - 学生主导、成人边界与协作: 05-team/mentors.md
- 项目执行与风险:
  - 立项、阶段评审与安全: 06-planning/planning-questions.md
- 资料与工具箱:
  - 来源、原图线索与资料缺口: 07-resources/source-method.md
  - 下载与交互工具:
    - 空白模板: 07-resources/templates.md
    - 全部财务模拟器: 04-business/calculators.md
    - 图表重建总索引: 07-resources/visual-tools.md
exclude_docs: 'assets/vendor/katex/*.md

  '
